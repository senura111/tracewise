name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Check every challenge's solution and starter
        run: npm run check:solutions

      - name: Check every explainer rule against real Python errors
        run: npm run check:explainer

      - name: Build
        run: npx vite build
